services:
  # ─── Frontend (Next.js – Dev) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secretaria-frontend
    restart: unless-stopped
    ports:
      - "3005:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.mjs:/app/next.config.mjs
    environment:
      - NEXT_PUBLIC_API_URL=http://69.169.103.28:8005/api/v1
      - NEXT_PUBLIC_BACKEND_URL=http://69.169.103.28:8005
      - WATCHPACK_POLLING=true
    networks:
      - secretaria-net
    depends_on:
      - backend

  # ─── Backend (FastAPI – Dev) ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secretaria-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8005:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
      - ./backend/templates:/app/templates
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/gestaodecomunicados.db
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost","http://69.169.103.28:3005","http://pgri.admsiga.org.br:3005"]
    networks:
      - secretaria-net

networks:
  secretaria-net:
    driver: bridge

volumes:
  db_data:
